<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Upload de Turmas</title>
</head>
  <body>
    <h1>CRUD - Disciplinas</h1>
    <form id="uploadForm">
      <label for="arquivo">Selecione o arquivo CSV:</label>
      <input type="file" id="arquivo" name="arquivo" accept=".csv" required />
      <br><br>
      <button type="button" id="btnUpload">Enviar</button>
    </form>
    <div>
      <input type="text" id="txtNome">
      <input type="text" id="txtIdTurma">
    </div>
    <div>
      <button id="btnCadastrar">Cadastrar Disciplina</button>
    </div>
    <div id="divDados"></div>
  </body>
  <script>
    const txtIdTurma = document.getElementById("txtIdTurma");
    const txtNome = document.getElementById("txtNome");
    const btnCadastrar = document.getElementById("btnCadastrar");
    const divDados = document.getElementById("divDados");
    const token = localStorage.getItem("token");
   
    getDisciplina();

    btnCadastrar.onclick = function () {
      postDisciplina();
    };

    document.getElementById("btnUpload").onclick = function () {
      const fileInput = document.getElementById("arquivo");
      const file = fileInput.files[0];

      if (!file) {
        alert("Por favor, selecione um arquivo CSV.");
        return;
      }

      const formData = new FormData();
      formData.append("arquivo", file);

      const URI = "/disciplinas/upload-csv";
    
      fetch(URI, {
        method: "POST",
        body: formData,
      })
        .then((response) => response.json())
        .then((data) => {
          if (data.status === true) {
            getDisciplina();
          } else {
            console.log('Erro' + data.msg);
          }
        })
        .catch((error) => {
          console.error("Erro ao enviar arquivo:", error);
        });
    };
  
    function construirTabela(textoJson) {
      divDados.innerHTML = "";

      const objJson = JSON.parse(textoJson);
      const disciplinas = objJson.disciplinas;
      const tabela = document.createElement("table");
      divDados.appendChild(tabela);

      const cabecalho = document.createElement("tr");
      const colunas = ["idDisciplina", "Nome", "idTurma", "Excluir", "Selecionar","Atualizar"];
      for (let texto of colunas) {
        const th = document.createElement("th");
        th.appendChild(document.createTextNode(texto));
        cabecalho.appendChild(th);
      }
      tabela.appendChild(cabecalho);

      for (let disciplina of disciplinas) {
        const linha = document.createElement("tr");
        const btnExcluir = document.createElement("button");
        const btnSelecionar = document.createElement("button");
        const btnAtualizar = document.createElement("button");
        btnExcluir.appendChild(document.createTextNode('Excluir'));
        btnSelecionar.appendChild(document.createTextNode('Selecionar'));
        btnAtualizar.appendChild(document.createTextNode('Atualizar'));
        const tdIdDisciplina = document.createElement("td");
        const tdExcluir = document.createElement("td");
        const tdSelecionar = document.createElement("td");
        const tdAtualizar = document.createElement("td");
        tdIdDisciplina.appendChild(document.createTextNode(disciplina.idDisciplina));
        tdExcluir.appendChild(btnExcluir);
        tdSelecionar.appendChild(btnSelecionar);
        tdAtualizar.appendChild(btnAtualizar);
        linha.appendChild(tdIdDisciplina);
        
        btnExcluir.onclick = function(){
          const idDisciplina = disciplina.idDisciplina;
          deleteDisciplina(idDisciplina);
        }
       
        btnSelecionar.onclick = function(){ 
          txtIdTurma.value = disciplina.idTurma;
          txtNome.value = disciplina.nome;
        }
        
        btnAtualizar.onclick = function(){
          const idDisciplina = disciplina.idDisciplina;
          putDisciplina(idDisciplina);
        }
        
        const tdNome = document.createElement("td");
        tdNome.appendChild(document.createTextNode(disciplina.nome));
        linha.appendChild(tdNome);
        
        const tdIdTurma = document.createElement("td");
        tdIdTurma.appendChild(document.createTextNode(disciplina.idTurma));
        linha.appendChild(tdIdTurma);

        linha.appendChild(tdExcluir);
        linha.appendChild(tdSelecionar);
        linha.appendChild(tdAtualizar);
        tabela.appendChild(linha);
      }
    }

    function getDisciplina() {
      const URI = "/disciplinas";
      fetch(URI, {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + token,
          "Accept": "application/json",
          "Content-Type": "application/json",
        },
      })
        .then((resposta) => resposta.text())
        .then((respostaConvertida) => {
          construirTabela(respostaConvertida);
        })
        .catch((error) => {
          alert(error);
        });
    }
    
    function postDisciplina() {
      const nome = txtNome.value;
      const idTurma= txtIdTurma.value;
      const URI = "/disciplinas";

      if (!idTurma || !nome) {
        alert("Por favor, preencha todos os campos.");
        return;
      }

      const objDisciplina = {
        disciplina: {
          nome: nome,
          idTurma: idTurma,
        },
      };

      fetch(URI, {
        method: "POST",
        body: JSON.stringify(objDisciplina),
        headers: {
          "Authorization": "Bearer " + token,
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
      })
        .then((resposta) => resposta.text())
        .then((respostaConvertida) => {
          const obj = JSON.parse(respostaConvertida);
          if (obj.status === true) {
            getDisciplina();
            txtIdTurma.value = "";
            txtNome.value = "";
          }
          
          alert(obj.msg);
        })
        .catch((error) => {
          alert(error);
        });
    }
 
    function putDisciplina(idDisciplina) {
      const nome = txtNome.value;
      const idTurma = txtIdTurma.value;
      const URI = "/disciplinas/" + idDisciplina;

      if (!idTurma || !nome) {
        alert("Por favor, preencha todos os campos.");
        return;
      }

      const objDisciplina = {
        disciplina: {
          nome: nome,
          idTurma: idTurma
        },
      };

      fetch(URI, {
        method: "PUT",
        body: JSON.stringify(objDisciplina),
        headers: {
          "Authorization": "Bearer " + token,
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
      })
        .then((resposta) => resposta.text())
        .then((respostaConvertida) => {
          const obj = JSON.parse(respostaConvertida);
          if (obj.status === true) {
            getDisciplina();

            txtNome.value = "";
            txtIdTurma.value = "";
          }

          alert(obj.msg)
        })
        .catch((error) => {
          alert(error);
        });
    }
 
    function deleteDisciplina(idDisciplina){

      const URI = '/disciplinas/' + idDisciplina;
      fetch(URI, {
        method: "DELETE",
        headers: {
          "Authorization": "Bearer " + token,
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
      })
        .then((resposta) => resposta.text())
        .then((respostaConvertida) => {
          const obj = JSON.parse(respostaConvertida);
          if (obj.status === true) {
            alert(obj.msg);
            getDisciplina();
          } 
          getDisciplina();
          alert(obj.msg);
        })
        .catch((error) => {
          alert(error);
        });
    }   
 </script>
</html>
