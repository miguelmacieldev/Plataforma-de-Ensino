<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script src="../script/tema.js"></script>
<script>
    const navegacao_inicio = document.getElementById('navegacao-inicio');

    const botao_atividades = document.getElementById('atividades');
    const botao_pontuacao = document.getElementById('pontuacao');
    const div_container_disciplina = document.getElementById('conteiner-disciplina');

    const token = localStorage.getItem('token');
    const idUsuario = localStorage.getItem('idUsuario');
    const tipoUsuario = localStorage.getItem('tipoUsuario');

    // Elementos
    const botaoNovaPostagem = document.getElementById('botao-nova-postagem');
    const popupTipo = document.getElementById('popup-tipo');
    const btnAtividade = document.getElementById('btn-atividade');
    const btnComentario = document.getElementById('btn-comentario');
    const editorContainerWrapper = document.getElementById('editor-container-wrapper');
    const dataEntregaContainer = document.getElementById('data-entrega-container');
    const btnCancelar = document.getElementById('btn-cancelar');
    const btnEnviar = document.getElementById('btn-enviar');
    const arquivoUpload = document.getElementById('arquivo-upload');
    const nomeArquivo = document.getElementById('nome-arquivo');
    // const navegacao_inicio = document.getElementById('navegacao-inicio');
    let quill = null;
    let tipoPostagemAtual = null;
    let arquivoSelecionado = null;

    const navegacao_potuacao = document.getElementById('navegacao-pontuacao');
    const div_usuario_info = document.querySelector('.usuario-info');

    if (tipoUsuario === "professor") {
        div_usuario_info.classList.add('professor');
    } else {
        div_usuario_info.classList.remove('professor');
    }
    

    function alternarAba(abaSelecionada) {


        document.querySelectorAll('nav ul li').forEach(li => li.classList.remove('active'));
        abaSelecionada.classList.add('active');

        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

        if (abaSelecionada.id === 'atividades') {
            div_container_disciplina.classList.remove('hidden');
            document.getElementById('conteiner-pontuacao').classList.add('hidden');
            botaoNovaPostagem.style.display = "flex";
            getAtividades();
        } else {
            document.getElementById('conteiner-pontuacao').classList.remove('hidden');
            div_container_disciplina.classList.add('hidden');
            botaoNovaPostagem.style.display = "none";
            exbirPontuacao();
        }

        podePostar();
    }


    botao_atividades.addEventListener('click', () => alternarAba(botao_atividades));
    botao_pontuacao.addEventListener('click', () => alternarAba(botao_pontuacao));

    navegacao_inicio.href = tipoUsuario === "professor"
    ? "pagina_professor_principal.html"
    : "pagina_aluno_principal.html";


    if(tipoUsuario === "professor"){
        navegacao_potuacao.style.display = "none";
    }
    
    botaoNovaPostagem.addEventListener('click', function() {
    const estaVisivel = popupTipo.classList.contains('visible');
    
    if (estaVisivel) {
        popupTipo.classList.remove('visible');
        popupTipo.classList.add('hidden');
    } else {
        popupTipo.classList.remove('hidden');
        popupTipo.classList.add('visible');
        document.getElementById('btn-comentario').classList.add('animar');
    }
});
    btnAtividade.addEventListener('click', () => {
        tipoPostagemAtual = 'atividade';
        abrirFormulario();
    });

    btnComentario.addEventListener('click', () => {
        tipoPostagemAtual = 'comentario';
        abrirFormulario();
    });

    function abrirFormulario() {
        if (!quill) {
            quill = new Quill('#editor-container', {
                theme: 'snow',
                modules: { toolbar: '#toolbar' }
            });
        }
        editorContainerWrapper.classList.remove('hidden');
        popupTipo.classList.add('hidden');

        if (tipoPostagemAtual === 'atividade') {
            dataEntregaContainer.classList.remove('hidden');
            configurarDataMinima();
        } else {
            dataEntregaContainer.classList.add('hidden');
        }
    }

    btnCancelar.addEventListener('click', () => {
        editorContainerWrapper.classList.add('hidden');
        limparFormulario();
    });

    arquivoUpload.addEventListener('change', function () {
        if (this.files && this.files[0]) {
            const file = this.files[0];
            if (file.type !== 'application/pdf' || file.size > 5 * 1024 * 1024) {
                alert("Arquivo inválido. Apenas PDF até 5MB.");
                return;
            }
            arquivoSelecionado = file;
            nomeArquivo.textContent = file.name;
        }
    });

    btnEnviar.addEventListener('click', async () => {
        if (!quill) return;
        const descricao = quill.root.innerHTML.trim();
        if (!descricao) return alert("Escreva algo.");

        let dataEntrega = null;
        if (tipoPostagemAtual === 'atividade') {
            dataEntrega = document.getElementById('data-entrega').value;
            if (!dataEntrega) return alert("Defina a data de entrega.");
        }

        const ids = await getIdsDisciplinaProfessorporDisciplina(localStorage.getItem('idDisciplinaSelecionada'));
        if (!ids || ids.length === 0) return alert("Nenhum vínculo encontrado.");

            if (tipoPostagemAtual === 'atividade') {
                dataEntrega = document.getElementById('data-entrega').value;

                // 🔹 Verifica se a data está no formato AAAA-MM-DD
                if (!validarFormatoData(dataEntrega)) {
                    return alert("Data inválida. Use o formato AAAA-MM-DD (ex: 2025-10-15).");
                }

                // 🔹 Verifica se a data não é anterior a hoje
                const hoje = new Date().toISOString().split('T')[0];
                if (dataEntrega < hoje) {
                    return alert("A data de entrega não pode ser anterior à data atual.");
                }
            }

        // Se houver mais de um vínculo, use o primeiro
        const idDisciplinaProfessor = ids[0];
        await postAtividade(tipoPostagemAtual, idDisciplinaProfessor, dataEntrega);
        limparFormulario();
        editorContainerWrapper.classList.add('hidden');
    });

    function limparFormulario() {
        if (quill) quill.setContents([]);
        arquivoUpload.value = '';
        nomeArquivo.textContent = "Nenhum arquivo selecionado";
        arquivoSelecionado = null;
        tipoPostagemAtual = null;
    }

    function configurarDataMinima() {
        const amanha = new Date(Date.now() + 86400000);
        const dataFormatada = amanha.toISOString().split('T')[0];
        document.getElementById('data-entrega').min = dataFormatada;
        document.getElementById('data-entrega').value = dataFormatada;
    }

    function validarFormatoData(data) {
        const regex = /^\d{4}-\d{2}-\d{2}$/;
        if (!regex.test(data)) return false;

        // Verifica se é uma data válida no calendário
        const d = new Date(data);
        return d instanceof Date && !isNaN(d);
    }

    function podePostar() {
        if (tipoUsuario === "aluno") {
            botaoNovaPostagem.style.display = "none";
        }
    }

    // ======================= FUNÇÕES DE BACKEND ========================


        async function getIdsDisciplinaProfessorporDisciplina(idDisciplina) {
        try {
            const res = await fetch(`/disciplinas-professores/disciplinas/${idDisciplina}`, {
                headers: { "Authorization": "Bearer " + token }
            });
            const json = await res.json();
            if (json.status) {
                return json.resultados.map(r => r.idDisciplinaProfessor);
            }else{
                return false
            }

            return [];
        } catch (err) {
            console.error("Erro ao buscar vínculos:", err);
            return [];
        }
    }



    async function getIdsDisciplinaProfessor(idProf) {
        try {
            const res = await fetch(`/disciplinas-professores/professores/${idProf}`, {
                headers: { "Authorization": "Bearer " + token }
            });
            const json = await res.json();
            if (json.status) {
                return json.disciplinaProfessor.map(r => r.idDisciplinaProfessor);
            }else{
                return false
            }

            return [];
        } catch (err) {
            console.error("Erro ao buscar vínculos:", err);
            return [];
        }
    }

    async function postAtividade(tipo, idDisciplinaProfessor, dataEntrega = null) {
        const descricao = quill.root.innerHTML.trim();
        const dataPostagem = new Date().toISOString().split('T')[0];

        const formData = new FormData();
        formData.append('atividade[descricao]', descricao);
        formData.append('atividade[devolucao]', tipo === 'atividade' ? 1 : 0);
        formData.append('atividade[dataPostagem]', dataPostagem);
        formData.append('atividade[dataEntrega]', dataEntrega);
        formData.append('atividade[idDisciplinaProfessor]', idDisciplinaProfessor);
        if (arquivoSelecionado) formData.append('arquivo', arquivoSelecionado);

        const res = await fetch("/atividades", {
            method: "POST",
            body: formData,
            headers: { "Authorization": "Bearer " + token }
        });
        const json = await res.json();
        alert(json.msg || (json.status ? "Postado!" : "Erro ao postar."));
        if (json.status) getAtividades();
    }


   async function exbirPontuacao() {   
    const listaDeAlunos = await getAlunos(localStorage.getItem('idTurmaSelecionada')); 
        console.log(listaDeAlunos);
       renderizarTabelaAlunos(listaDeAlunos);
    }
    
    
    function renderizarTabelaAlunos(listaDeAlunos) {

             const divTabela = document.querySelector('.tabela');

            if (!listaDeAlunos || listaDeAlunos.length === 0) {
                divTabela.innerHTML = '<p>Nenhum aluno encontrado.</p>';
                return;
            }

            const tabela = document.createElement('table');
            tabela.innerHTML = `
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Matrícula</th>
                        <th>Nome</th>
                        <th>Pontuação</th>
                    </tr>
                </thead>
                <tbody>
                    ${listaDeAlunos.map(aluno => `
                        <tr class="info-aluno">
                            <td class='foto-tabela'><span class='letra-aluno'>${aluno.nome[0]}</span></td>
                            <td class="matricula">${aluno.matricula}</td>
                            <td class="nome-aluno">${aluno.nome.length > 10 ? aluno.nome.substring(0, 10) + "..." : aluno.nome}</td>
                            <td>${aluno.pontuacao}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;

            divTabela.innerHTML = ''; // Limpa conteúdo anterior
            divTabela.appendChild(tabela);
        }

    async function getAlunos(idTurma) {
            try {
                const resposta = await fetch('alunos/turmas/' + idTurma, {
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Accept": "application/json"
                    }
                });
                const dados = await resposta.json();
                return dados.aluno || []; // ← retorna lista (ou vazia)
            } catch (error) {
                console.error(error);
                return [];
            }
        }



    async function getAtividades() {
        try {
            const res = await fetch("/atividades", {
                headers: { "Authorization": "Bearer " + token }
            });
            const dados = await res.json();

            if (dados.status && Array.isArray(dados.atividades)) {
                renderizarAtividades(dados.atividades);
            }
        } catch (err) {
            console.error("Erro ao buscar atividades:", err);
        }
    }

    async function renderizarAtividades(atividades) {
    
    const container = document.getElementById("lista-atividades");
    container.innerHTML = "";

    const idProfList = tipoUsuario === "professor"
        ? (await getIdsDisciplinaProfessorporDisciplina(localStorage.getItem('idDisciplinaSelecionada')))
        : [];


    for (const atividade of atividades) {
        try {
            const idDisc = atividade.idDisciplinaProfessor
            ? await getDisciplinaProfessor(atividade.idDisciplinaProfessor)
            : null;

            const corresponde =
                (tipoUsuario === "aluno" && Number(localStorage.getItem('idDisciplinaSelecionada')) === idDisc) ||
                (tipoUsuario === "professor" && idProfList.includes(Number(atividade.idDisciplinaProfessor)));

                

                if (!corresponde) continue;

                const div = document.createElement("div");
                const tipo = atividade.devolucao === 1 ? "atividade" : "comentario";
               
                const content = document.createElement("div");
            
                const prazoExpirado = tipoUsuario === "aluno" && atividade.devolucao === 1 &&
                    new Date(atividade.dataEntrega) < new Date();

                if (prazoExpirado) div.classList.add("atividade-bloqueada");

                const item = document.createElement(prazoExpirado ? "div" : "a");

                if (!prazoExpirado && atividade.devolucao === 1) {
                    item.addEventListener("click", () => {
                        localStorage.setItem('idAtividadeSelecionada', atividade.idAtividade);
                        window.location.href = tipoUsuario === "aluno" ?
                            "pagina_atividade_disciplina.html" :
                            "pagina_correcao_atividade.html";
                    });
                }

                let descricaoPreview = "";
                let s = atividade.descricao;

                for (let i = 0; i < s.length; i++) {
                    if (i > 0 && i % 110 === 0) {
                        descricaoPreview += "<br>"; // quebra de linha a cada 10 caracteres
                    }
                    descricaoPreview += s[i];
                }


                item.className = `container-${tipo}`;

                item.innerHTML = `
                    <p class="foto">P</p>
                    <div class=${tipo}>
                        <p>${atividade.devolucao === 1?  atividade.descricao.substring(0, 45) + "..." : descricaoPreview}</p> 
                        ${atividade.devolucao === 1 ? `<p class="data">${atividade.dataEntrega}</p>` : `<p class="data">${atividade.dataPostagem}</p>`}
                        ${prazoExpirado ? '<p class="aviso-prazo">Prazo expirado</p>' : ''}
                        ${atividade.caminhoGravacao != null && atividade.devolucao === 0? `<a class='link-download' href=${atividade.caminhoGravacao}>download</a>` : ''}
                    ${tipoUsuario === "professor" ? `<p class="opcao-excluir" data-id-atividade="${atividade.idAtividade}">...</p>` : ''}
                    </div>
                `;
                content.appendChild(item);

                div.appendChild(content);
                container.appendChild(div);
            } catch (e) {
                console.error("Erro ao renderizar atividade:", e);
            }
        }

        document.querySelectorAll('.opcao-excluir').forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                const id = btn.dataset.idAtividade;
                const popup = document.createElement('div');
                popup.className = 'popup-excluir';
                popup.style.position = 'absolute';
                popup.style.top = `${e.pageY}px`;
                popup.style.left = `${e.pageX}px`;
                popup.innerHTML = `<button class="botao-excluir" data-id-atividade="${id}" onclick="excluirAtividade(this)">Excluir</button>`;
                document.body.appendChild(popup);

                setTimeout(() => {
                    const close = ev => {
                        if (!popup.contains(ev.target)) {
                            popup.remove();
                            document.removeEventListener('click', close);
                        }
                    };
                    document.addEventListener('click', close);
                }, 0);
            });
        });
    }

    window.excluirAtividade = async function (botao) {
        const id = botao.dataset.idAtividade;
        try {
            const res = await fetch(`/atividades/${id}`, {
                method: "DELETE",
                headers: { "Authorization": "Bearer " + token }
            });
            const json = await res.json();
            alert(json.msg || "Excluído");
            if (json.status) getAtividades();
        } catch (err) {
            console.error("Erro ao excluir:", err);
            alert("Erro ao excluir.");
        }
    };

    async function getDisciplinaProfessor(id) {
        const res = await fetch(`/disciplinas-professores/${id}`, {
            headers: { "Authorization": "Bearer " + token }
        });
        const json = await res.json();
        return json?.disciplinaProfessor?.idDisciplina || null;
    }

    // Nome da turma/disciplina no topo
    async function getTurma() {
        const res = await fetch(`/turmas/${localStorage.getItem('idTurmaSelecionada')}`, {
            headers: { "Authorization": "Bearer " + token }
        });
        const json = await res.json();
        if (json.turma) nomearDivTurmaDisciplina(json.turma.curso, 'turma');
    }

    async function getDisciplina() {
        const res = await fetch(`/disciplinas/${localStorage.getItem('idDisciplinaSelecionada')}`, {
            headers: { "Authorization": "Bearer " + token }
        });
        const json = await res.json();
        if (json.disciplina) nomearDivTurmaDisciplina(json.disciplina.nome, 'disciplina');
    }

    function nomearDivTurmaDisciplina(conteudo, tipo) {
        const div = document.querySelector('.disciplina-sala');
        if (!div) return;
        div.dataset[tipo] = conteudo;
        const texto = `${div.dataset.turma || ''} - ${div.dataset.disciplina || ''}`;
        div.innerHTML = texto.trim();
    }

    if (localStorage.getItem("tipoUsuario") === "aluno") {
        getAluno();
    }else{
        getProfessor();
    }

    async function getAluno() {
        const aluno = await fetch("/alunos/" + localStorage.getItem("idUsuario"), {
            headers: {
                    "Authorization": "Bearer " + token,
                "Accept": "application/json"
            }
        });

        const dados = await aluno.json();
        const nome = dados.aluno.nome;
        const foto = nome[0];
        
        document.querySelector(".foto-barra").textContent = foto;
        document.querySelector(".nome").textContent = nome;
    }

    async function getProfessor() {
        const professor = await fetch("/professores/" + localStorage.getItem("idUsuario"), {
            headers: {
                    "Authorization": "Bearer " + token,
                "Accept": "application/json"
            }
        });

        const dados = await professor.json();
        const nome = dados.professor[0].nome;
        const foto = nome[0];
        
        document.querySelector(".foto-barra").textContent = foto;
        document.querySelector(".nome").textContent = nome;
    }

    getTurma();
    getDisciplina();
    getAtividades();
    podePostar();
</script>

</body>
</html>
