<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correção de Atividade</title>
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../style/padrao.css">
    <link rel="stylesheet" href="../style/pagina_correcao_atividade.css">
</head>
<body>
    <aside class="barra">
        <header class="barra-topo">
            <a href="#" class="header-logo">
                <img src="../../imgs/logositetech.png" alt="TechInfo" data-aos="zoom-in">
            </a>
            <div class="header-titulo">
                <p>TechInfo</p>   
            </div>
        </header>

        <nav class="barralateral-nav">
            <!--Primária Nav-->
            <ul class="primeiralinhabarra">
                <li class="nav-item">
                    <a href="#" class="nav-link" data-aos="fade-up">
                        <span class="material-symbols-outlined">home</span>
                        <span class="nav-label">Início</span>
                    </a>
                </li>
                 <li class="nav-item">
                    <a href="#" class="nav-link" data-aos="fade-up">
                        <span class="material-symbols-outlined">star</span>
                        <span class="nav-label">Pontuação</span>
                    </a>
                </li>
                 <li class="nav-item">
                    <a href="#" class="nav-link" data-aos="fade-up">
                        <span class="material-symbols-outlined">calendar_today</span>
                        <span class="nav-label">Agenda</span>
                    </a>
                </li>
                 <li class="nav-item">
                    <a href="#" class="nav-link" data-aos="fade-up">
                        <span class="material-symbols-outlined">logout</span>
                        <span class="nav-label">Sair</span>
                    </a>
                </li>
            </ul>
            <div class="usuario-info">
                <p class="foto-barra"></p>
                <p class="nome"></pc>
            </div>
        </nav>
    </aside>
    <main>
        <nav class="nav-atividades">
            <ul>
                <li id="corrigir" class="active">
                    Corrigir                    
                </li>
                <li id="grafico">
                    Gráficos
                </li>
            </ul>
        </nav>
        
  
        <div id="atividades-entregues" class="atividades-entregues"></div>
      
            
        <div id="popup-options" class="popup-options">
            <button class="popup-option" id="baixar-entrega">
                Baixar
            </button>
            <button class="popup-option" id="corrigir-entrega">
                Corrigir
            </button>
        </div>

        <div class="popup-corrigir hidden" id="popup-corrigir">
            <div class="conteudo">
                <input name="nota" id="input-nota" min="0" max="10" type="number" placeholder="Digite a nota da atividade">
                <div>
                    <button class="botao" id="enviar-nota">Enviar</button>
                    <button class="botao" id="cancelar">Cancelar</button>
                </div>
            </div>
        </div>
        <div id="grafico-tab" class="grafico-tab hidden">
            <div class="grafs">
                <canvas id="graficoMediaNotas"></canvas>
                <canvas id="graficoEntregaStatus" ></canvas>
            </div>
        </div>
    </main>

    <div class="cursor-outer"></div>
    <div class="cursor-inner"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
    <script src="../script/cursor.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    const token = localStorage.getItem('token');
    const botao_corrigir = document.getElementById('corrigir');
    const botao_grafico = document.getElementById('grafico');
    const div_atividades_entregues = document.getElementById('atividades-entregues');
    const enviar_nota = document.getElementById('enviar-nota');
    const popupOptions = document.getElementById('popup-options');
    const botao_baixar_entrega = document.getElementById('baixar-entrega');

    let entregas = []; // Lista global de entregas
    let currentEntregaId = null;

    // Função para buscar entregas da atividade
    async function getAtividadeEntregues() {
        try {
            const resposta = await fetch(`/atividades-entregues/atividades/${localStorage.getItem('idAtividadeSelecionada')}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            const obj = await resposta.json();

            if (obj.status === true) {
                return obj.resultado;
            } else {
                div_atividades_entregues.innerHTML = '<p class="sem-entregas">Nenhuma entrega encontrada.</p>';
                return [];
            }
        } catch (error) {
            console.error("Erro ao carregar entregas:", error);
            div_atividades_entregues.innerHTML = '<p class="erro">Erro ao carregar entregas.</p>';
            return [];
        }
    }

    document.getElementById('cancelar').addEventListener('click', ()=>{
        document.getElementById('popup-corrigir').classList.add('hidden');
    });

    // Renderiza as entregas na tela
    async function renderizarAtividades() {
        entregas = await getAtividadeEntregues();
        div_atividades_entregues.innerHTML = '';

        if (entregas.length === 0) {
            div_atividades_entregues.innerHTML = '<p class="sem-entregas">Nenhuma entrega encontrada.</p>';
            return;
        }

        entregas.forEach(entrega => {
            const div = document.createElement('div');
            div.classList.add('card-entrega');

            div.innerHTML = `
                <div class="info-aluno">
                    <p>Matrícula: ${entrega.matriculaAluno || 'N/A'}</p>
                    <p>Entregue em: ${entrega.dataEntrega ? new Date(entrega.dataEntrega).toLocaleString() : 'Data não informada'}</p>
                    ${entrega.nota >=0 ? `<p class="nota">Nota: ${entrega.nota}</p>` : '<p class="pendente">Pendente</p>'}
                </div>
                <div class="acoes">
                    <p class="botao-opcoes" data-id="${entrega.idAtividadeEntregue}">...</p>
                </div>
            `;

            if(entrega.nota >= 0){
                div.classList.add('corrigido'); 
            }

            botao_baixar_entrega.addEventListener('click', ()=>{
                window.location.href = entrega.caminhoGravacao;
            });

            div_atividades_entregues.appendChild(div);
        });

        // Botões de "..." para cada entrega
        document.querySelectorAll('.botao-opcoes').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                currentEntregaId = e.currentTarget.getAttribute('data-id');

                popupOptions.classList.remove('show');

                const rect = e.currentTarget.getBoundingClientRect();
                popupOptions.style.top = `${rect.bottom + window.scrollY - popupOptions.offsetHeight - 55}px`;
                popupOptions.style.left = `${rect.left + window.scrollX - popupOptions.offsetWidth - 300}px`;

                setTimeout(() => {
                    popupOptions.classList.add('show');
                }, 0);
            });
        });
    }


function exibirGraficoMediaNotas() {
    const ctx = document.getElementById('graficoMediaNotas').getContext('2d');
    
    const notasValidas = entregas
        .filter(e => typeof e.nota === 'number' && e.nota >= 0)
        .map(e => e.nota);

    const media = notasValidas.length > 0
        ? notasValidas.reduce((acc, nota) => acc + nota, 0) / notasValidas.length
        : 0;

    Chart.getChart("graficoMediaNotas")?.destroy();

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Média Geral'],
            datasets: [{
                label: 'Nota média',
                data: [media.toFixed(2)],
                backgroundColor: 'rgba(69, 77, 246)',
                borderColor: 'rgba(75, 192, 192)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    max: 10
                }
            }
        }
    });
}

function exibirGraficoEntregaStatus() {
    const ctx = document.getElementById('graficoEntregaStatus').getContext('2d');

    const entregaram = entregas.filter(e => e.dataEntrega).length;
    const totalEsperado = parseInt(localStorage.getItem('totalAlunos') || entregaram); // Ajuste conforme sua lógica
    const naoEntregaram = totalEsperado - entregaram;

    Chart.getChart("graficoEntregaStatus")?.destroy();

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Entregaram', 'Não Entregaram'],
            datasets: [{
                data: [entregaram, naoEntregaram],
                backgroundColor: ['#454df6', '#f13a3c'],
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom',
                }
            }
        }
    });
}

    // Fecha popup se clicar fora
    document.addEventListener('click', (e) => {
        if (!popupOptions.contains(e.target) && !e.target.classList.contains('botao-opcoes')) {
            popupOptions.classList.remove('show');
        }
    });

    // Botão de "Corrigir"
    document.getElementById('corrigir-entrega').addEventListener('click', () => {
        document.getElementById('popup-corrigir').classList.remove('hidden');
    });

    // Botão de "Enviar Nota"
    enviar_nota.addEventListener('click', async () => {
        const nota = parseFloat(document.getElementById('input-nota').value);
        const entrega = entregas.find(e => e.idAtividadeEntregue == currentEntregaId);

        if (!entrega || isNaN(nota)) {
            alert('Erro: entrega não encontrada ou nota inválida.');
            return;
        }

        const dataEntregaFormatada = new Date(entrega.dataEntrega)
            .toISOString().replace('T', ' ').split('.')[0];

        const obj = {
            atividadeentregue : {
                nota: nota,
                caminhoGravacao: entrega.caminhoGravacao,
                matriculaAluno: entrega.matriculaAluno,
                idAtividade: entrega.idAtividade,
                dataEntrega: dataEntregaFormatada
            }
        };

        // Envia a nota
        const resposta = await fetch('/atividades-entregues/' + currentEntregaId, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(obj)
        });

        const data = await resposta.json();

        if (data.status) {
            // Buscar a pontuação atual do aluno
            const pontuacaoAtual = await getAluno(entrega.matriculaAluno);
            const notaAntiga = typeof entrega.nota === 'number' ? entrega.nota : 0;
            const novaPontuacao = pontuacaoAtual - notaAntiga + nota;

            await atualizarPontuacaoAluno(entrega.matriculaAluno, novaPontuacao);
            

            alert('Nota enviada com sucesso!');
            document.getElementById('popup-corrigir').classList.add('hidden');
            renderizarAtividades();
        } else {
            alert('Erro ao enviar nota.');
        }
    });


    async function getAluno(matriculaAluno) {
        try {
            const res = await fetch(`/alunos/${matriculaAluno}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            const data = await res.json();
            if (data.status) {
                return data.aluno.pontuacao; 
            } else {
                console.error("Erro ao buscar aluno:", data);
                return null;
            }
        } catch (error) {
            console.error("Erro na requisição:", error);
            return null;
        }
    }

    async function atualizarPontuacaoAluno(matriculaAluno, novaPontuacao) {
        try {
            const res = await fetch(`/alunos/pontuacao/${matriculaAluno}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ 'aluno': {
                    pontuacao: novaPontuacao
                }
             })
            });
            
            const data = await res.json();
            
            if (data.status === true) {
                console.log(data);
            }
        } catch (error) {
            console.error("Erro na requisição:", error);
        }
    }

    function alternarAba(abaSelecionada) {
        document.querySelectorAll('nav ul li').forEach(li => li.classList.remove('active'));
        abaSelecionada.classList.add('active');

        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

        if (abaSelecionada.id === 'corrigir') {
            div_atividades_entregues.classList.remove('hidden');
            document.getElementById('grafico-tab').classList.add('hidden');
            renderizarAtividades();
        } else {
            document.getElementById('grafico-tab').classList.remove('hidden');
            div_atividades_entregues.classList.add('hidden');
            exibirGraficoMediaNotas();
            exibirGraficoEntregaStatus();
        }
    }

    // Listeners de abas
    botao_corrigir.addEventListener('click', () => alternarAba(botao_corrigir));
    botao_grafico.addEventListener('click', () => alternarAba(botao_grafico));

    // Quando a página carregar
    document.addEventListener('DOMContentLoaded', () => {
        renderizarAtividades();
    });

    if (localStorage.getItem("tipoUsuario") === "professor") {
        getProfessor();
    }

    async function getProfessor() {
        const professor = await fetch("/professores/" + localStorage.getItem("idUsuario"), {
            headers: {
                "Authorization": "Bearer " + token,
                "Accept": "application/json"
            }
        });

        const dados = await professor.json();
        const nome = dados.professor[0].nome;
        const foto = nome[0];
        
        document.querySelector(".foto-barra").textContent = foto;
        document.querySelector(".nome").textContent = nome;
    }

</script>

</body>
</html>
