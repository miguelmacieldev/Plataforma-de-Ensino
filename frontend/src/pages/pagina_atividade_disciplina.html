<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../style/pagina_atividade_disciplina.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <title>Document</title>
</head>
<body>
<aside class="barra">
        <header class="barra-topo">
            <a href="#" class="header-logo">
                <img src="../../imgs/logositetech.png" alt="TechInfo" data-aos="zoom-in">
            </a>
            <div class="header-titulo">
                <p>InfoTec</p>   
            </div>
        </header>

        <nav class="barralateral-nav">
            <!--Primária Nav-->
            <ul class="primeiralinhabarra">
                <li class="nav-item">
                    <a href="/pagina_aluno_principal.html" class="nav-link" data-aos="fade-up">
                        <span class="material-symbols-outlined">home</span>
                        <span class="nav-label">Início</span>
                    </a>
                </li>
                 <li class="nav-item">
                    <a href="/pagina_pontuacao.html" class="nav-link" data-aos="fade-up">
                        <span class="material-symbols-outlined">star</span>
                        <span class="nav-label">Pontuação</span>
                    </a>
                </li>
                 <li class="nav-item">
                    <a href="/pagina_agenda.html" class="nav-link" data-aos="fade-up">
                        <span class="material-symbols-outlined">calendar_today</span>
                        <span class="nav-label">Agenda</span>
                    </a>
                </li>
                 <li class="nav-item">
                    <a href="/pagina_inicial.html" class="nav-link" data-aos="fade-up">
                        <span class="material-symbols-outlined">logout</span>
                        <span class="nav-label">Sair</span>
                    </a>
                </li>
            </ul>
            <div class="usuario-info">
                <p class="foto-barra"></p>
                <p class="nome"></pc>
            </div>
        </nav>
    </aside>
    <main>
        <div class="atividade">
            <div id="info">
                <a href="" id="link-pdf">
                    <div id="descricao-div"></div>
                </a>
                <p class="data" id="data">Data entrega : </p>
            </div>
            
            <div id="arquivo-container" class="">
                <input type="file" id="arquivo-upload" name="arquivo" accept=".pdf" class="hidden">

                <span class="material-symbols-outlined" id="icone-upload">create_new_folder</span>
                <p id="nome-arquivo">Nenhum arquivo selecionado</p>
            </div>
            <div class="botao-container">
                <a href="#" id="enviar" class="botao"><span class="material-symbols-outlined" id="enviar" class="botao">send_and_archive</span></a>
            </div>
        </div>
    </main>

    <script>
    const token = localStorage.getItem('token');
    let file = null; // corrigido: agora é let para ser atualizado

    getAtividade();

    async function getAtividade() {
    try {
        const resposta = await fetch('atividades/' + localStorage.getItem('idAtividadeSelecionada'), {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token,
                "Accept": "application/json",
            }
        });

        const obj = await resposta.json();
        if (obj.status === true && obj.atividade) {
            renderizarAtividade(obj.atividade);

            // Verifica se o aluno já enviou
            const idAtividade = localStorage.getItem('idAtividadeSelecionada');
            const matriculaAluno = localStorage.getItem('idUsuario');
            verificarEntregaAluno(idAtividade, matriculaAluno);
        } else {
            console.error("Erro ao buscar atividade");
        }
    } catch (error) {
        console.error("Erro na requisição:", error);
    }
}


    function renderizarAtividade(atividade){
        const descricao = document.getElementById("descricao-div");
        descricao.innerHTML = atividade.descricao;
        if (atividade.caminhoGravacao !== '') {
            const link_pdf = document.getElementById('link-pdf');
            link_pdf.href = atividade.caminhoGravacao;
        }
        const data = document.getElementById("data");
        data.innerHTML += atividade.dataEntrega;
    }

    // Abrir o seletor de arquivos ao clicar na imagem
    document.getElementById('icone-upload').addEventListener('click', () => {
        document.getElementById('arquivo-upload').click();
    });

    // Quando o arquivo for selecionado
    document.getElementById('arquivo-upload').addEventListener('change', function(e) {
        file = this.files[0];
        if (!file) return;

        if (file.type !== 'application/pdf') {
            alert('Por favor, selecione um arquivo PDF.');
            file = null;
            return;
        }

        if (file.size > 5 * 1024 * 1024) {
            alert('O arquivo é muito grande. Tamanho máximo: 5MB');
            file = null;
            return;
        }

        document.getElementById('nome-arquivo').textContent = file.name;
    });

    // Enviar o arquivo ao clicar no botão
    document.getElementById('enviar').addEventListener('click', function(e) {
        e.preventDefault();
        if (!file) {
            alert('Nenhum arquivo selecionado!');
            return;
        }
        postAtividade();
    });

    async function postAtividade() {
    const dataEntrega = new Date().toISOString();
    const idAtividade = localStorage.getItem('idAtividadeSelecionada');
    const matriculaAluno = localStorage.getItem('idUsuario');
    const nota = -1;


    // Converte a data para o formato aceito pelo MySQL
    const dataEntregaFormatada = new Date(dataEntrega)
        .toISOString()
        .replace('T', ' ')
        .split('.')[0]; // Remove o milissegundo e o 'Z'


    const formData = new FormData();
    formData.append('arquivo', file); 
    formData.append('idAtividade', idAtividade);
    formData.append('dataEntrega', dataEntregaFormatada);
    formData.append('matriculaAluno', matriculaAluno);
    formData.append('nota', nota);

    try {
        const resposta = await fetch('atividades-entregues', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + token
            },
            body: formData
        });

        const result = await resposta.json();

        if (result.status === true) {
            alert('Arquivo enviado com sucesso!');
            desabilitarAtividade();
            location.reload();
        } else {
            alert('Erro ao enviar arquivo.');
            console.error(result);
        }
    } catch (error) {
        console.error('Erro ao enviar arquivo:', error);
        alert('Erro na conexão com o servidor.');
    }
}

    async function verificarEntregaAluno(idAtividade, matriculaAluno) {
    try {
        const resposta = await fetch(`atividades-entregues/${idAtividade}/${matriculaAluno}`, {
            method: 'GET',
            headers: {
                'Authorization': 'Bearer ' + token,
                'Accept': 'application/json'
            }
        });

        const data = await resposta.json();
        
        if (resposta.ok && data.status === true) {
            desabilitarAtividade();
        }
    } catch (erro) {
        console.error('Erro ao verificar entrega:', erro);
    }
}


    function desabilitarAtividade(){
        document.getElementById('nome-arquivo').textContent = "Atividade já enviada.";
        document.getElementById('icone-upload').style.pointerEvents = "none";
        document.getElementById('icone-upload').style.opacity = "0.5";
        document.getElementById('enviar').style.display = "none"; 
    }

    if (localStorage.getItem("tipoUsuario") === "aluno") {
        getAluno();
    }

    async function getAluno() {
        console.log("Aluno logado");
        const aluno = await fetch("/alunos/" + localStorage.getItem("idUsuario"), {
            headers: {
                    "Authorization": "Bearer " + token,
                "Accept": "application/json"
            }
        });

        const dados = await aluno.json();
        const nome = dados.aluno.nome;
        const foto = nome[0];
        
        document.querySelector(".foto-barra").textContent = foto;
        document.querySelector(".nome").textContent = nome;
    }
    </script>
</body>
</html>
