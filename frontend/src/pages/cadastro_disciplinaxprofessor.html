<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Upload de Turmas</title>
</head>
  <body>
    <h1>CRUD - DisciplinasxProfessores</h1>
    <form id="uploadForm">
      <label for="arquivo">Selecione o arquivo CSV:</label>
      <input type="file" id="arquivo" name="arquivo" accept=".csv" required />
      <br><br>
      <button type="button" id="btnUpload">Enviar</button>
    </form>
  </body>
  <script>
    document.getElementById("btnUpload").onclick = function () {
  const fileInput = document.getElementById("arquivo");
  const file = fileInput.files[0];

  if (!file) {
    alert("Por favor, selecione um arquivo CSV.");
    return;
  }

  const formData = new FormData();
  formData.append("arquivo", file);


  const URI = "/disciplinas-professores/upload-csv";
  console.log(URI)
  fetch(URI, {
    method: "POST",
    body: formData,
  })
    .then((response) => response.json())
    .then((data) => {
      if (data.status === true) {
        //getDisciplina();
        alert('o')
      } else {
        console.log('Erro' + data.msg);
      }
    })
    .catch((error) => {
      console.error("Erro ao enviar arquivo:", error);
    });
};
  </script>
</html>
