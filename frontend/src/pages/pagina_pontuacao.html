    <script>
        const token = localStorage.getItem('token');

        async function getAluno(){
            try{
                const aluno = await fetch('alunos/' + localStorage.getItem('idUsuario'), {
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Accept": "application/json"
                    }
                })
                const dados = await aluno.json();
                getAlunos(dados.aluno.idTurmaPrimaria)
            }catch(error){
                console.error(error); 
            }
        }

        function renderizarTabelaAlunos(listaDeAlunos) {
            const divTabela = document.querySelector('.tabela');

            if (!listaDeAlunos || listaDeAlunos.length === 0) {
                divTabela.innerHTML = '<p>Nenhum aluno encontrado.</p>';
                return;
            }

            const tabela = document.createElement('table');
            tabela.innerHTML = `
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Matrícula</th>
                        <th>Nome</th>
                        <th>Pontuação</th>
                    </tr>
                </thead>
            
                <tbody>
                    ${listaDeAlunos.map(aluno => `
                        <tr class="info-aluno">
                            <td class='foto'><span class='letra-aluno'>${aluno.nome[0]}</span></td>
                            <td class="matricula">${aluno.matricula}</td>
                            <td class="nome">${aluno.nome}</td>
                            <td>${aluno.pontuacao}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;

            divTabela.innerHTML = ''; // Limpa o conteúdo anterior
            divTabela.appendChild(tabela);
        }

        async function getAlunos(idTurma) {
            try {
                const alunos = await fetch('alunos/turmas/' + idTurma, {
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Accept": "application/json"
                    }
                });
                const dados = await alunos.json();
                renderizarTabelaAlunos(dados.aluno); // ← Aqui chamamos a renderização
            } catch (error) {
                console.error(error); 
            }
        }

        getAluno()

    </script>
