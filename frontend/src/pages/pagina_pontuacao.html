    <script>
        const token = localStorage.getItem('token');

        async function getAluno() {
            try {
                const resposta = await fetch('alunos/' + localStorage.getItem('idUsuario'), {
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Accept": "application/json"
                    }
                });
                const dados = await resposta.json();
                
                const nome = dados.aluno.nome;
                const foto = nome[0];
                document.querySelector(".foto-barra").textContent = foto;
                document.querySelector(".nome").textContent = nome;

                // 🔹 Pega alunos das duas turmas e junta em uma única lista
                const alunosPrimaria = await getAlunos(dados.aluno.idTurmaPrimaria);
                const alunosSecundaria = await getAlunos(dados.aluno.idTurmaSecundaria);

                // 🔹 Junta as duas listas e remove duplicados (caso existam)
                const todosAlunos = [...alunosPrimaria, ...alunosSecundaria].filter(
                    (aluno, index, self) =>
                        index === self.findIndex(a => a.matricula === aluno.matricula)
                );

                // 🔹 Renderiza tudo junto
                renderizarTabelaAlunos(todosAlunos);

            } catch (error) {
                console.error(error);
            }
        }

        function renderizarTabelaAlunos(listaDeAlunos) {
            const divTabela = document.querySelector('.tabela');

            if (!listaDeAlunos || listaDeAlunos.length === 0) {
                divTabela.innerHTML = '<p>Nenhum aluno encontrado.</p>';
                return;
            }

            const tabela = document.createElement('table');
            tabela.innerHTML = `
                <thead>
                    <tr>
                        <th>Foto</th>
                        <th>Matrícula</th>
                        <th>Nome</th>
                        <th>Pontuação</th>
                    </tr>
                </thead>
                <tbody>
                    ${listaDeAlunos.map(aluno => `
                        <tr class="info-aluno">
                            <td class='foto'><span class='letra-aluno'>${aluno.nome[0]}</span></td>
                            <td class="matricula">${aluno.matricula}</td>
                            <td class="nome-aluno">${aluno.nome.length > 10 ? aluno.nome.substring(0, 10) + "..." : aluno.nome}</td>
                            <td>${aluno.pontuacao}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;

            divTabela.innerHTML = ''; // Limpa conteúdo anterior
            divTabela.appendChild(tabela);
        }

        async function getAlunos(idTurma) {
            try {
                const resposta = await fetch('alunos/turmas/' + idTurma, {
                    headers: {
                        "Authorization": "Bearer " + token,
                        "Accept": "application/json"
                    }
                });
                const dados = await resposta.json();
                return dados.aluno || []; // ← retorna lista (ou vazia)
            } catch (error) {
                console.error(error);
                return [];
            }
        }

        getAluno()

    </script>
