<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../style/padrao.css">
        <link rel="stylesheet" href="../style/entrar.css">
        <script src="../script/jwt-decode.min.js"></script>
        <title>Document</title>
    </head>
    <body>
        <header>
            <nav>
                <p id="nome-pagina">infotec.</p>
                <ul>
                    <li><a href="./">início</a></li>
                </ul>
                <a href="./entrar.html" class="botao">entrar</a>
            </nav>
        </header>
        <main>
            <div class="fundo">
                <form action="">
                    <h2>Seja Bem-Vindo Novamente!</h2>
                    <div class="input-conteiner">
                        <input type="text" id="nome" required>
                        <label for="email">Email</label>
                    </div>
                    <div class="input-conteiner">
                        <input type="text" id="senha" required>
                        <label for="senha">Senha</label>
                    </div>
                    <input type="submit" class="inverso">
                </form>
            </div>
        </main>
    </body>
    <script>
    const form = document.querySelector('form');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.querySelector('#nome').value;
        const senha = document.querySelector('#senha').value;

        try {
            const resposta = await fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, senha })
            });

            const dados = await resposta.json();

            if (!resposta.ok) {
                alert(dados.mensagem || 'Erro no login');
                return;
            }
            
            localStorage.setItem('token', dados.token);
            let decoded = jwt_decode(dados.token);
            localStorage.setItem('tipoUsuario', decoded.role);
            localStorage.setItem('idUsuario', decoded.id);

            if (dados.role === 'admin') {
                window.location.href = './painel.html';
            } else if (dados.role === 'aluno') {
                window.location.href = './pagina_aluno_principal.html';
            } else if (dados.role === 'professor') {
                window.location.href = './pagina_professor_principal.html';
            } else {
                alert('Tipo de usuário desconhecido');
            }

        } catch (error) {
            console.error('Erro na requisição:', error);
            alert('Erro ao tentar logar');
        }
    });
    </script>
</html>
