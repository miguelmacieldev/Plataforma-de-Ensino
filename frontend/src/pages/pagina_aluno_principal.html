        <main>
            <div class="disciplinas" id="disciplinas"></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>


        <script>
            const divDisciplinas = document.getElementById("disciplinas");
            const token = localStorage.getItem("token");
            const decoded = jwt_decode(token);

            getAlunoById();

            async function getAlunoById() {
                try {
                const resposta = await fetch("/alunos/" + decoded.id, {
                    headers: {
                    "Authorization": "Bearer " + token,
                    "Accept": "application/json"
                    }
                });

                const dados = await resposta.json();

                const turma1 = dados.aluno.idTurmaPrimaria;
                const turma2 = dados.aluno.idTurmaSecundaria;

                if (turma1) {
                    await buscarDisciplinasPorTurma(turma1);
                }
                if (turma2 && turma2 !== turma1) {
                    await buscarDisciplinasPorTurma(turma2);
                }

                } catch (err) {
                console.error("Erro ao buscar aluno:", err);
                }
            }

            async function buscarDisciplinasPorTurma(idTurma) {
                try {
                    const resposta = await fetch(`/disciplinas/turmas/${idTurma}`, {
                        headers: {
                            "Authorization": "Bearer " + token,
                            "Accept": "application/json"
                        }
                    });

                    const dados = await resposta.json();

                    if (dados.disciplinas && dados.disciplinas.length > 0) {
                        dados.disciplinas.forEach((disciplina, index) => {
                            const div = document.createElement("div");
                            div.classList.add("disciplina");

                            const link = document.createElement("a");
                            link.href = "#";
                            link.innerHTML = `<p><span class="foto">${disciplina.nomeProfessor[0]}</span> ${disciplina.nomeDisciplina}</p>`;
                            div.addEventListener("click", (e) => {
                                e.preventDefault();
                                localStorage.setItem("idDisciplinaSelecionada", disciplina.idDisciplina);
                                localStorage.setItem("idTurmaSelecionada", idTurma);
                                window.location.href = "pagina_conteudo_disciplina.html";
                            });

                            div.appendChild(link);
                            div.innerHTML += `<p class="opcoes">...</p>
                                               <p class="nome-professor">${disciplina.nomeProfessor}</p> `;
                            divDisciplinas.appendChild(div);
                        });
                    }

                } catch (err) {
                    console.error("Erro ao buscar disciplinas:", err);
                }
            }

            if (localStorage.getItem("tipoUsuario") === "aluno") {
                getAluno();
            }

            async function getAluno() {
                const aluno = await fetch("/alunos/" + localStorage.getItem("idUsuario"), {
                    headers: {
                         "Authorization": "Bearer " + token,
                        "Accept": "application/json"
                    }
                });

                const dados = await aluno.json();
                const nome = dados.aluno.nome;
                const foto = nome[0];
                
                document.querySelector(".foto-barra").textContent = foto;
                document.querySelector(".nome").textContent = nome;
            }
            
        </script>
