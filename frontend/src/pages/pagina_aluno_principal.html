<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../style/padrao.css" />
    <link rel="stylesheet" href="../style/pagina_principal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Document</title>
    <script src="../script/jwt-decode.min.js"></script>
    </head>
    <body>
        <aside class="menu-lateral">
            <p class="logo">
                <i class="bi bi-backpack3-fill"></i>
                infotec
            </p>
            <ul>
                <li>
                    <i class="bi bi-house-door-fill"></i>
                    <a href="" class="item-barra">Início</a>
                </li>
                <li class="graficos">
                    <i class="bi bi-file-earmark-bar-graph-fill"></i>
                    <a href="" class="item-barra">Gráficos</a>
                </li>
                <li >
                    <i class="bi bi-book-fill"></i>
                    <a href="./pagina_agenda.html" class="item-barra">Agenda</a>
                </li>
                <li class="sair">                    
                    <i class="bi bi-box-arrow-in-right"></i>
                    <a href="" class="item-barra">Sair</a>
                </li>
            </ul>
        </aside>
        <main>
            <div class="disciplinas" id="disciplinas"></div>
        </main>
        <script>
            const divDisciplinas = document.getElementById("disciplinas");
            const token = localStorage.getItem("token");
            const decoded = jwt_decode(token);

            getAlunoById();

            async function getAlunoById() {
                try {
                const resposta = await fetch("/alunos/" + decoded.id, {
                    headers: {
                    "Authorization": "Bearer " + token,
                    "Accept": "application/json"
                    }
                });

                const dados = await resposta.json();

                const turma1 = dados.aluno.idTurmaPrimaria;
                const turma2 = dados.aluno.idTurmaSecundaria;

                if (turma1) {
                    await buscarDisciplinasPorTurma(turma1);
                }
                if (turma2 && turma2 !== turma1) {
                    await buscarDisciplinasPorTurma(turma2);
                }

                } catch (err) {
                console.error("Erro ao buscar aluno:", err);
                }
            }

            async function buscarDisciplinasPorTurma(idTurma) {
                try {
                    const resposta = await fetch(`/disciplinas/turmas/${idTurma}`, {
                        headers: {
                            "Authorization": "Bearer " + token,
                            "Accept": "application/json"
                        }
                    });

                    const dados = await resposta.json();

                    if (dados.disciplinas && dados.disciplinas.length > 0) {
                        dados.disciplinas.forEach((disciplina, index) => {
                            const div = document.createElement("div");
                            div.classList.add("disciplina");

                            const link = document.createElement("a");
                            link.href = "#";
                            link.innerHTML = `<p>${disciplina.nomeDisciplina} - ${disciplina.nomeProfessor}</p>`;
                            div.addEventListener("click", (e) => {
                                e.preventDefault();
                                localStorage.setItem("idDisciplinaSelecionada", disciplina.idDisciplina);
                                localStorage.setItem("idTurmaSelecionada", idTurma);
                                window.location.href = "pagina_conteudo_disciplina.html";
                            });

                            div.appendChild(link);
                            div.innerHTML += `<p class="opcoes">...</p>`;
                            divDisciplinas.appendChild(div);
                        });
                    }

                } catch (err) {
                    console.error("Erro ao buscar disciplinas:", err);
                }
            }

                
        </script>
    </body>
</html>
