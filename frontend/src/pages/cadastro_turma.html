<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Upload de Turmas</title>
</head>
<body>
  <h1>Upload de Arquivo CSV - Turmas</h1>
  <form action="http://localhost:3000/turmas/upload-csv" method="POST" enctype="multipart/form-data">
    <label for="arquivo">Selecione o arquivo CSV:</label>
    <input type="file" name="arquivo" required />
    <br><br>
    <button type="submit">Enviar</button>
  </form>
</body>
</html>
